name: Build Roohani Dhaal Android APK and AAB

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'roohani-dhaal-api36-sdk24-ready-source.zip'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Google Play versionCode (must be higher than every previously uploaded version)'
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: roohani-dhaal-android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADMOB_APP_ID: ca-app-pub-1134522787126944~8921860280
      VITE_ADMOB_APP_ID: ca-app-pub-1134522787126944~8921860280
      VITE_ADMOB_BANNER_ID: ca-app-pub-1134522787126944/7417206921
      VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
      VERSION_NAME: 1.0.0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install

      - name: Verify project identity and AdMob configuration
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = require('./package.json');
          const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          if (c.appId !== 'com.albazi.roohanidhaal') throw new Error('Unexpected appId: ' + c.appId);
          if (c.appName !== 'روحانی ڈھال') throw new Error('Unexpected appName: ' + c.appName);
          if (c.webDir !== 'dist') throw new Error('webDir must be dist');
          if (!p.dependencies || !p.dependencies['@capacitor/android'] || !p.dependencies['@capacitor-community/admob']) {
            throw new Error('Capacitor Android or AdMob dependency is missing');
          }
          if (!fs.existsSync('scripts/configure-android.py')) throw new Error('scripts/configure-android.py missing');
          console.log('Project identity and required dependencies verified.');
          NODE
          python3 -m pip install --user pillow

      - name: Build web application
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html

      - name: Add Android platform and sync
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android

      - name: Generate Android icons
        run: |
          set -euo pipefail
          if [ -f scripts/create-android-icons.py ]; then
            python3 scripts/create-android-icons.py
          else
            echo 'Icon generator not found; checking generated launcher resources.'
          fi

      - name: Configure SDK 24, API 36, app identity and AdMob
        run: |
          set -euo pipefail
          python3 scripts/configure-android.py
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'com.google.android.gms.permission.AD_ID' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml
          echo 'SDK, package, app label and AdMob manifest checks passed.'

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roohani-dhaal-release.jks"
          test -s "$RUNNER_TEMP/roohani-dhaal-release.jks"
          export KS_PATH="$RUNNER_TEMP/roohani-dhaal-release.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' in s and 'signingConfig signingConfigs.release' in s:
              print('Release signing already configured; leaving it unchanged.')
          else:
              signing = '''\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("KS_PATH"))\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n'''
              if 'android {' not in s:
                  raise SystemExit('android { block not found in app/build.gradle')
              s = s.replace('android {', 'android {' + signing, 1)
              marker = re_marker = 'buildTypes {'
              if marker not in s:
                  raise SystemExit('buildTypes { block not found in app/build.gradle')
              s = s.replace(marker, marker + '\n        release {\n            signingConfig signingConfigs.release\n        }', 1)
              p.write_text(s)
          PY
          # Export signing values for Gradle in the following step via GitHub environment.
          {
            echo "KS_PATH=$KS_PATH"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease
          cd ..
          mkdir -p release-files
          cp android/app/build/outputs/apk/release/*.apk release-files/roohani-dhaal-release.apk
          cp android/app/build/outputs/bundle/release/*.aab release-files/roohani-dhaal-release.aab
          test -s release-files/roohani-dhaal-release.apk
          test -s release-files/roohani-dhaal-release.aab

      - name: Verify APK and AAB files
        run: |
          set -euo pipefail
          file release-files/roohani-dhaal-release.apk release-files/roohani-dhaal-release.aab
          unzip -t release-files/roohani-dhaal-release.apk >/dev/null
          unzip -t release-files/roohani-dhaal-release.aab >/dev/null
          echo 'Both APK and AAB archives passed integrity checks.'

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roohani-dhaal-android-release
          path: release-files/*
          if-no-files-found: error
          retention-days: 30
