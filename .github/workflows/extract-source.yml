
name: Extract Roohani Dhaal ZIP

on:
  push:
    branches:
      - main
    paths:
      - roohani-dhaal-api36-sdk24-ready-source.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract source ZIP
        run: |
          set -e

          ZIP="roohani-dhaal-api36-sdk24-ready-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          mkdir -p /tmp/roohani-source
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("roohani-dhaal-api36-sdk24-ready-source.zip")
          destination = Path("/tmp/roohani-source").resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit("Unsafe ZIP path detected")
              z.extractall(destination)

          print("ZIP extracted safely")
          PY

          SOURCE_DIR=$(find /tmp/roohani-source -maxdepth 4 -name package.json -print -quit | xargs dirname)

          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/package.json" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi

          echo "Source directory: $SOURCE_DIR"
          cp -a "$SOURCE_DIR"/. .

          rm -f "$ZIP"

          test -f package.json
          test -f index.html
          test -f capacitor.config.json

          echo "Source files installed successfully"

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract complete Roohani Dhaal source"
            git push
          fi
